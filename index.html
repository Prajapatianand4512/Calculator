<!DOCTYPE html>
<html lang="en" data-theme="cyber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Calc — Ultimate Interactive Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Background Glow Orbs -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <div class="app-container">
    <!-- Main Calculator Card -->
    <main class="calculator-card" id="calcCard">
      <!-- Header Controls -->
      <header class="calc-header">
        <div class="brand">
          <span class="pulse-indicator"></span>
          <span class="brand-title">NEXUS<span class="brand-sub">CALC</span></span>
        </div>

        <div class="header-actions">
          <!-- Scientific Mode Toggle -->
          <button class="icon-btn" id="sciToggleBtn" title="Toggle Scientific Mode" aria-label="Scientific Mode">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19l4-14M16 19l4-14M3 8h18M3 16h18"/>
            </svg>
            <span class="badge">Sci</span>
          </button>

          <!-- History Toggle Button -->
          <button class="icon-btn" id="historyToggleBtn" title="Calculation History" aria-label="Calculation History">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </button>

          <!-- Sound FX Toggle -->
          <button class="icon-btn" id="soundToggleBtn" title="Toggle Sound Effects" aria-label="Toggle Sound Effects">
            <svg class="icon sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
            <svg class="icon sound-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <line x1="23" y1="9" x2="17" y2="15"/>
              <line x1="17" y1="9" x2="23" y2="15"/>
            </svg>
          </button>

          <!-- Theme Selector -->
          <div class="theme-dropdown">
            <button class="icon-btn" id="themeBtn" title="Change Theme" aria-label="Change Theme">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
              </svg>
            </button>
            <div class="theme-menu" id="themeMenu">
              <button class="theme-option active" data-theme="cyber">
                <span class="dot cyber-dot"></span> Cyber Neon
              </button>
              <button class="theme-option" data-theme="aurora">
                <span class="dot aurora-dot"></span> Aurora Glow
              </button>
              <button class="theme-option" data-theme="light">
                <span class="dot light-dot"></span> Frost Light
              </button>
              <button class="theme-option" data-theme="oled">
                <span class="dot oled-dot"></span> Midnight Black
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Calculator Screen / Display Section -->
      <section class="display-container">
        <!-- Status Row: Memory & Rad/Deg indication -->
        <div class="status-row">
          <div class="mode-tags">
            <span class="tag" id="angleModeTag">DEG</span>
            <span class="tag memory-tag hidden" id="memoryTag">M</span>
          </div>
          <button class="copy-btn" id="copyResultBtn" title="Copy result to clipboard">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span class="copy-text">Copy</span>
          </button>
        </div>

        <!-- Expression Input Display -->
        <div class="expression-wrapper">
          <div class="expression-display" id="expressionDisplay" placeholder="0"></div>
        </div>

        <!-- Realtime / Final Result Display -->
        <div class="result-wrapper">
          <span class="result-prefix" id="resultPrefix">=</span>
          <div class="result-display" id="resultDisplay">0</div>
        </div>
      </section>

      <!-- Notification Toast (for copy, errors, etc.) -->
      <div class="toast" id="toast">Copied to clipboard!</div>

      <!-- Keypads Container (Standard vs Landscape Scientific Mode) -->
      <div class="keypads-wrapper" id="keypadsWrapper">
        <!-- Scientific Keypad Panel (3 columns x 5 rows = 15 keys) -->
        <div class="sci-drawer collapsed" id="sciDrawer">
          <div class="sci-grid">
            <!-- Row 1 -->
            <button class="btn btn-sci" data-action="toggle-angle" id="angleToggleBtn" title="Angle Mode">RAD</button>
            <button class="btn btn-sci" data-action="sci-func" data-value="sin(">sin</button>
            <button class="btn btn-sci" data-action="sci-func" data-value="cos(">cos</button>

            <!-- Row 2 -->
            <button class="btn btn-sci" data-action="sci-func" data-value="tan(">tan</button>
            <button class="btn btn-sci" data-action="sci-func" data-value="asin(">sin⁻¹</button>
            <button class="btn btn-sci" data-action="sci-func" data-value="acos(">cos⁻¹</button>

            <!-- Row 3 -->
            <button class="btn btn-sci" data-action="sci-func" data-value="atan(">tan⁻¹</button>
            <button class="btn btn-sci" data-action="constant" data-value="π">π</button>
            <button class="btn btn-sci" data-action="constant" data-value="e">e</button>

            <!-- Row 4 -->
            <button class="btn btn-sci" data-action="sci-op" data-value="^">xʸ</button>
            <button class="btn btn-sci" data-action="sci-func" data-value="sqrt(">√</button>
            <button class="btn btn-sci" data-action="sci-func" data-value="abs(">|x|</button>

            <!-- Row 5 -->
            <button class="btn btn-sci" data-action="sci-func" data-value="log(">log</button>
            <button class="btn btn-sci" data-action="sci-func" data-value="ln(">ln</button>
            <button class="btn btn-sci" data-action="factorial" data-value="!">n!</button>
          </div>
        </div>

        <!-- Main Keypad (4 columns x 5 rows = 20 keys) -->
        <section class="keypad-grid">
          <!-- Row 1 -->
          <button class="btn btn-function" data-action="clear" id="clearBtn">AC</button>
          <button class="btn btn-function" data-action="delete" id="deleteBtn" title="Backspace (⌫)">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
              <line x1="18" y1="9" x2="12" y2="15"/>
              <line x1="12" y1="9" x2="18" y2="15"/>
            </svg>
          </button>
          <button class="btn btn-function" data-action="parenthesis" title="Parentheses">( )</button>
          <button class="btn btn-operator" data-action="operator" data-value="/" title="Divide">÷</button>

          <!-- Row 2 -->
          <button class="btn btn-num" data-action="number" data-value="7">7</button>
          <button class="btn btn-num" data-action="number" data-value="8">8</button>
          <button class="btn btn-num" data-action="number" data-value="9">9</button>
          <button class="btn btn-operator" data-action="operator" data-value="*" title="Multiply">×</button>

          <!-- Row 3 -->
          <button class="btn btn-num" data-action="number" data-value="4">4</button>
          <button class="btn btn-num" data-action="number" data-value="5">5</button>
          <button class="btn btn-num" data-action="number" data-value="6">6</button>
          <button class="btn btn-operator" data-action="operator" data-value="-" title="Subtract">−</button>

          <!-- Row 4 -->
          <button class="btn btn-num" data-action="number" data-value="1">1</button>
          <button class="btn btn-num" data-action="number" data-value="2">2</button>
          <button class="btn btn-num" data-action="number" data-value="3">3</button>
          <button class="btn btn-operator" data-action="operator" data-value="+" title="Add">+</button>

          <!-- Row 5 -->
          <button class="btn btn-function" data-action="negate" title="Positive/Negative">±</button>
          <button class="btn btn-num" data-action="number" data-value="0">0</button>
          <button class="btn btn-num" data-action="decimal" data-value=".">.</button>
          <button class="btn btn-equals" data-action="calculate" id="equalsBtn" title="Calculate (=)">=</button>
        </section>
      </div>

      <!-- Keyboard shortcuts hint footer -->
      <footer class="calc-footer">
        <span class="shortcut-tip"><kbd>Enter</kbd> = <kbd>Esc</kbd> AC <kbd>⌫</kbd> Del</span>
      </footer>
    </main>

    <!-- History Sliding Drawer -->
    <aside class="history-panel" id="historyPanel">
      <div class="history-header">
        <div class="history-title">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <h3>History</h3>
        </div>
        <div class="history-actions">
          <button class="icon-btn-sm" id="clearHistoryBtn" title="Clear All History">
            <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
          <button class="icon-btn-sm" id="closeHistoryBtn" title="Close Panel">
            <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="history-list" id="historyList">
        <!-- Rendered dynamically -->
        <div class="empty-history">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <p>No calculation history yet</p>
          <span>Calculations will appear here</span>
        </div>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
